name: Deploy Project app

on:
  workflow_dispatch:
    inputs:
      project_sha:
        description: Exact TradeJS-Project SHA and app image tag
        required: true
        type: string
  repository_dispatch:
    types:
      - tradejs-project-image-published

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Deploy
        uses: actions/checkout@v6

      - name: Resolve immutable Project release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT_SHA: ${{ inputs.project_sha }}
          PAYLOAD_PROJECT_SHA: ${{ github.event.client_payload.project_sha }}
        run: |
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            project_sha="$PAYLOAD_PROJECT_SHA"
          else
            project_sha="$INPUT_PROJECT_SHA"
          fi
          if [ "${#project_sha}" -ne 40 ] || printf '%s' "$project_sha" | grep -q '[^0-9a-f]'; then
            echo 'Project SHA must be a full lowercase Git SHA' >&2
            exit 1
          fi
          echo "project_sha=$project_sha" >> "$GITHUB_OUTPUT"

      - name: Validate app rollout secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY NEXTAUTH_SECRET PG_PASSWORD AGENT_GITHUB_TOKEN COINALYZE_API_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || {
            echo "Missing required GitHub Actions secrets:$missing" >&2
            exit 1
          }

      - name: Checkout immutable TradeJS Project
        uses: actions/checkout@v6
        with:
          repository: TradeJS-Dev/TradeJS-Project
          ref: ${{ steps.release.outputs.project_sha }}
          path: tradejs-project

      - name: Build incoming runtime environment
        env:
          DEPLOY_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DEPLOY_PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          DEPLOY_AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          DEPLOY_COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          cp tradejs-project/deploy/runtime.env runtime.env.incoming
          cat >> runtime.env.incoming <<'EOF'
          APP_MEMORY_LIMIT=5g
          AGENT_MEMORY_LIMIT=4g
          SITE_MEMORY_LIMIT=512m
          DOCS_MEMORY_LIMIT=256m
          TIMESCALE_MEMORY_LIMIT=4g
          REDIS_MEMORY_LIMIT=4g
          ML_INFER_MEMORY_LIMIT=1g
          NGINX_MEMORY_LIMIT=256m
          CERTBOT_MEMORY_LIMIT=256m
          RESEARCH_AUTO_PARENT_HEAP_MB=1024
          RESEARCH_AUTO_BACKTEST_PARENT_HEAP_MB=2048
          RESEARCH_AUTO_AI_TRAIN_PARENT_HEAP_MB=2048
          RESEARCH_AUTO_AGENT_PARENT_HEAP_MB=1536
          AGENT_GITHUB_ORGANIZATION=TradeJS-Dev
          AGENT_GITHUB_BASE_BRANCH=main
          EOF
          printf 'AUTH_SECRET=%s\n' "$DEPLOY_NEXTAUTH_SECRET" >> runtime.env.incoming
          printf 'NEXTAUTH_SECRET=%s\n' "$DEPLOY_NEXTAUTH_SECRET" >> runtime.env.incoming
          printf 'PG_PASSWORD=%s\n' "$DEPLOY_PG_PASSWORD" >> runtime.env.incoming
          printf 'AGENT_GITHUB_TOKEN=%s\n' "$DEPLOY_AGENT_GITHUB_TOKEN" >> runtime.env.incoming
          printf 'COINALYZE_API_KEY=%s\n' "$DEPLOY_COINALYZE_API_KEY" >> runtime.env.incoming

      - name: Copy app rollout files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "runtime.env.incoming,docker-compose.prod.yml,scripts"
          target: ~/

      - name: Deploy exact Project app
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PROJECT_SHA: ${{ steps.release.outputs.project_sha }}
          DEPLOY_PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_PROJECT_SHA,DEPLOY_PG_PASSWORD
          script: |
            set -Eeuo pipefail
            cd ~/
            chmod +x ./scripts/release-state.sh ./scripts/redis-backup.sh ./scripts/rollback-app.sh

            RELEASE_STATE_FILE=release.env ./scripts/release-state.sh validate
            for container in inv-redis inv-timescale ml-infer nginx; do
              docker inspect "$container" >/dev/null 2>&1 || {
                echo "Required production container is missing: $container" >&2
                exit 1
              }
            done
            docker exec inv-redis redis-cli ping | grep -q PONG
            docker exec inv-timescale pg_isready -U app -d app

            cp release.env release.env.previous
            cp .env .env.previous
            rollback_app() {
              cp release.env.previous release.env
              cp .env.previous .env
              RELEASE_ENV_FILE=release.env ./scripts/rollback-app.sh || true
              exit 1
            }

            mv runtime.env.incoming .env || rollback_app
            RELEASE_STATE_FILE=release.env ./scripts/release-state.sh update app "$DEPLOY_PROJECT_SHA" "$DEPLOY_PROJECT_SHA" || rollback_app

            ./scripts/redis-backup.sh --verify || rollback_app
            docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml pull app || rollback_app

            previous_manifest="releases/runtime-package-manifest-previous.json"
            incoming_manifest="releases/runtime-package-manifest-$DEPLOY_PROJECT_SHA.json"
            manifest_diff="releases/runtime-package-diff-$DEPLOY_PROJECT_SHA.json"
            mkdir -p releases
            if ! docker cp app:/app/runtime-package-manifest.json "$previous_manifest" >/dev/null 2>&1; then
              printf '{"packages":{}}\n' > "$previous_manifest"
            fi
            incoming_container="runtime-manifest-${DEPLOY_PROJECT_SHA:0:12}"
            docker rm -f "$incoming_container" >/dev/null 2>&1 || true
            docker create --name "$incoming_container" "ghcr.io/tradejs-dev/tradejs-project-app:$DEPLOY_PROJECT_SHA" >/dev/null ||
              rollback_app
            docker cp "$incoming_container:/app/runtime-package-manifest.json" "$incoming_manifest" ||
              rollback_app
            docker rm "$incoming_container" >/dev/null
            docker run --rm --entrypoint node -v "$HOME:/deploy" "ghcr.io/tradejs-dev/tradejs-project-app:$DEPLOY_PROJECT_SHA" /deploy/scripts/compare-runtime-manifests.mjs "/deploy/$previous_manifest" "/deploy/$incoming_manifest" "/deploy/$manifest_diff" ||
              rollback_app

            escaped_pg_password="$(printf '%s' "$DEPLOY_PG_PASSWORD" | sed "s/'/''/g")"
            printf "ALTER ROLE app WITH PASSWORD '%s';\n" "$escaped_pg_password" |
              docker exec -i inv-timescale psql -v ON_ERROR_STOP=1 -U app -d app ||
              rollback_app
            unset escaped_pg_password

            docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml up -d --no-deps --force-recreate app ||
              rollback_app

            app_health=""
            for _attempt in $(seq 1 30); do
              app_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' app)"
              [ "$app_health" = healthy ] && break
              [ "$app_health" != unhealthy ] || {
                docker logs --tail 200 app
                rollback_app
              }
              sleep 5
            done
            [ "$app_health" = healthy ] || {
              docker logs --tail 200 app
              echo "App did not become healthy: $app_health" >&2
              rollback_app
            }

            docker exec app node --input-type=module --eval '
              const apiKey = String(process.env.COINALYZE_API_KEY ?? "").trim();
              if (!apiKey) throw new Error("COINALYZE_API_KEY is missing in the app container");
              const { getUserSettings, updateUserRecord } = await import("@tradejs/infra/userSettings");
              const current = await getUserSettings("root");
              if (current.COINALYZE_API_KEY !== apiKey) {
                await updateUserRecord("root", { COINALYZE_API_KEY: apiKey });
              }
              const verified = await getUserSettings("root");
              if (verified.COINALYZE_API_KEY !== apiKey) {
                throw new Error("Failed to synchronize the root Coinalyze credential");
              }
              console.log("Root Coinalyze credential is configured");
              process.exit(0);
            ' || rollback_app

            docker exec app ./node_modules/.bin/tradejs runtime-control verify --user root --deployment production || rollback_app
            docker exec nginx nginx -t
            docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml ps app
