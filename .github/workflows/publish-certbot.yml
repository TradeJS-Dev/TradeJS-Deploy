name: Publish patched Certbot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/certbot/**
      - .github/workflows/publish-certbot.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-patched-certbot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify and publish pinned Certbot
        env:
          IMAGE: ghcr.io/tradejs-dev/tradejs-certbot
        run: |
          docker build -f docker/certbot/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm --sysctl net.mptcp.enabled=0 --entrypoint python3 "$IMAGE:$GITHUB_SHA" /opt/security-certifi/verify_certifi.py --https
          docker push "$IMAGE:$GITHUB_SHA"
