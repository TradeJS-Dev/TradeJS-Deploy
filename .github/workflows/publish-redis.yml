name: Publish patched Redis Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/redis-stack/**
      - scripts/redis-image-smoke.mjs
      - .github/workflows/publish-redis.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-patched-redis
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify the exact image before publishing
        env:
          IMAGE: ghcr.io/tradejs-dev/tradejs-redis-stack:7.4.12-v1
        run: |
          docker build --pull -f docker/redis-stack/Dockerfile -t "$IMAGE" .
          node scripts/redis-image-smoke.mjs "$IMAGE"
          docker tag "$IMAGE" "ghcr.io/tradejs-dev/tradejs-redis-stack:$GITHUB_SHA"
          docker push "$IMAGE"
          docker push "ghcr.io/tradejs-dev/tradejs-redis-stack:$GITHUB_SHA"
