name: Runtime strategy config

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Read or mutate the canonical runtime strategy binding"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - audit
          - audit-backups
          - provision
          - rollout
          - pause
          - resume
          - rollback
      user_name:
        description: "Redis user namespace"
        required: true
        default: root
        type: string
      strategy_name:
        description: "Registered strategy name"
        required: true
        default: DoubleTap
        type: string
      deployment_id:
        description: "Runtime deployment id"
        required: true
        default: doubletap-forward
        type: string
      account_id:
        description: "Deployment account id used only by provision"
        required: true
        default: bybit-default
        type: string
      connector_name:
        description: "Connector and account provider used only by provision"
        required: true
        default: bybit
        type: string
      config_base64:
        description: "Secret-free strategy config JSON encoded as base64; provision or rollout"
        required: false
        type: string
      rollback_release:
        description: "Positive releaseVersion used only by rollback"
        required: false
        type: string
      confirm_mutation:
        description: "Required for every runtime write"
        required: true
        default: false
        type: boolean

concurrency:
  group: production-runtime-config
  cancel-in-progress: false

jobs:
  runtime-config:
    runs-on: ubuntu-latest
    environment: production
    env:
      RUNTIME_ACTION: ${{ inputs.action }}
      RUNTIME_USER: ${{ inputs.user_name }}
      RUNTIME_STRATEGY: ${{ inputs.strategy_name }}
      RUNTIME_DEPLOYMENT: ${{ inputs.deployment_id }}
      RUNTIME_ACCOUNT: ${{ inputs.account_id }}
      RUNTIME_CONNECTOR: ${{ inputs.connector_name }}
      RUNTIME_CONFIG_BASE64: ${{ inputs.config_base64 }}
      RUNTIME_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
      RUNTIME_CONFIRM_MUTATION: ${{ inputs.confirm_mutation }}
    steps:
      - name: Apply runtime config operation on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          envs: RUNTIME_ACTION,RUNTIME_USER,RUNTIME_STRATEGY,RUNTIME_DEPLOYMENT,RUNTIME_ACCOUNT,RUNTIME_CONNECTOR,RUNTIME_CONFIG_BASE64,RUNTIME_ROLLBACK_RELEASE,RUNTIME_CONFIRM_MUTATION
          script: |
            set -Eeuo pipefail
            cd ~/

            validate_identifier() {
              local label="$1"
              local value="$2"
              if [[ ! "$value" =~ ^[A-Za-z0-9._:-]+$ ]]; then
                printf 'Invalid %s: %s\n' "$label" "$value" >&2
                exit 1
              fi
            }

            validate_identifier user_name "$RUNTIME_USER"
            validate_identifier strategy_name "$RUNTIME_STRATEGY"
            validate_identifier deployment_id "$RUNTIME_DEPLOYMENT"
            validate_identifier account_id "$RUNTIME_ACCOUNT"
            validate_identifier connector_name "$RUNTIME_CONNECTOR"

            if ! docker inspect app >/dev/null 2>&1 || \
              [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' app)" != healthy ]
            then
              echo 'App container is not healthy' >&2
              exit 1
            fi
            docker exec app cat /app/runtime-package-manifest.json

            if [ "$RUNTIME_ACTION" = audit ]; then
              for pattern in \
                "users:$RUNTIME_USER:strategies:$RUNTIME_STRATEGY:release-seq" \
                "users:$RUNTIME_USER:strategies:$RUNTIME_STRATEGY:releases:*" \
                "users:$RUNTIME_USER:runtime:deployments:$RUNTIME_DEPLOYMENT" \
                "users:$RUNTIME_USER:trading-accounts:$RUNTIME_ACCOUNT"
              do
                printf 'Keys matching %s:\n' "$pattern"
                docker exec inv-redis redis-cli --scan --pattern "$pattern" |
                  while IFS= read -r key; do
                    [ -n "$key" ] || continue
                    printf '%s [%s]\n' "$key" \
                      "$(docker exec inv-redis redis-cli --raw TYPE "$key")"
                  done
              done
              exit 0
            fi

            if [ "$RUNTIME_ACTION" = audit-backups ]; then
              mapfile -t backups < <(
                find "$HOME/backups/redis" -maxdepth 1 -type f \
                  -name 'dump-*.rdb' | sort -r | head -n 5
              )
              [ "${#backups[@]}" -gt 0 ] || {
                echo 'No Redis backups found' >&2
                exit 1
              }
              audit_index=0
              for backup in "${backups[@]}"; do
                audit_index=$((audit_index + 1))
                sha256sum --check "$backup.sha256"
                audit_name="runtime-backup-audit-$$-$audit_index"
                cleanup_audit() {
                  docker rm -f "$audit_name" >/dev/null 2>&1 || true
                }
                docker run -d --name "$audit_name" --user 0 \
                  -v "$backup:/data/dump.rdb:ro" \
                  redis/redis-stack:7.4.0-v8 \
                  redis-stack-server --dir /data --dbfilename dump.rdb \
                  --appendonly no >/dev/null
                audit_ready=false
                for _attempt in $(seq 1 300); do
                  if docker exec "$audit_name" redis-cli ping 2>/dev/null | grep -q PONG; then
                    audit_ready=true
                    break
                  fi
                  sleep 1
                done
                [ "$audit_ready" = true ] || {
                  docker logs "$audit_name"
                  cleanup_audit
                  exit 1
                }
                printf 'Backup %s, DBSIZE=%s\n' \
                  "$(basename "$backup")" \
                  "$(docker exec "$audit_name" redis-cli --raw DBSIZE)"
                for pattern in \
                  "users:*:strategies:$RUNTIME_STRATEGY:release-seq" \
                  "users:*:strategies:$RUNTIME_STRATEGY:releases:*" \
                  "users:*:runtime:deployments:*" \
                  "users:*:trading-accounts:*"
                do
                  docker exec "$audit_name" redis-cli --scan --pattern "$pattern" |
                    while IFS= read -r key; do
                      [ -n "$key" ] || continue
                      printf '%s [%s]\n' "$key" \
                        "$(docker exec "$audit_name" redis-cli --raw TYPE "$key")"
                    done
                done
                cleanup_audit
              done
              exit 0
            fi

            command=(
              ./node_modules/.bin/tradejs runtime-config "$RUNTIME_ACTION"
              --user "$RUNTIME_USER"
              --strategy "$RUNTIME_STRATEGY"
              --deployment "$RUNTIME_DEPLOYMENT"
            )
            mutates=false
            runtime_config_path=''
            cleanup_runtime_config() {
              if [ -n "$runtime_config_path" ]; then
                docker exec app rm -f "$runtime_config_path" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup_runtime_config EXIT

            case "$RUNTIME_ACTION" in
              verify)
                ;;
              provision | rollout)
                mutates=true
                if [ -z "$RUNTIME_CONFIG_BASE64" ] || \
                  [[ ! "$RUNTIME_CONFIG_BASE64" =~ ^[A-Za-z0-9+/=]+$ ]]
                then
                  echo 'config_base64 must contain a base64-encoded JSON object' >&2
                  exit 1
                fi
                runtime_config_path="/tmp/runtime-config-$$.json"
                printf '%s' "$RUNTIME_CONFIG_BASE64" |
                  base64 --decode |
                  docker exec -i app sh -c \
                    "umask 077; cat > '$runtime_config_path'"
                docker exec app node -e \
                  'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
                  "$runtime_config_path"
                command+=(--file "$runtime_config_path" --write)
                if [ "$RUNTIME_ACTION" = provision ]; then
                  command+=(
                    --account "$RUNTIME_ACCOUNT"
                    --connector "$RUNTIME_CONNECTOR"
                    --provider "$RUNTIME_CONNECTOR"
                    --label "$RUNTIME_DEPLOYMENT"
                  )
                fi
                ;;
              pause | resume)
                mutates=true
                ;;
              rollback)
                mutates=true
                if [[ ! "$RUNTIME_ROLLBACK_RELEASE" =~ ^[1-9][0-9]*$ ]]; then
                  echo 'rollback_release must be a positive integer' >&2
                  exit 1
                fi
                command+=(--release "$RUNTIME_ROLLBACK_RELEASE")
                ;;
              *)
                echo "Unsupported runtime action: $RUNTIME_ACTION" >&2
                exit 1
                ;;
            esac

            if [ "$mutates" = true ]; then
              [ "$RUNTIME_CONFIRM_MUTATION" = true ] || {
                echo 'confirm_mutation must be enabled for a write operation' >&2
                exit 1
              }
              ./scripts/redis-backup.sh --verify
            fi

            docker exec app "${command[@]}"

            if [ "$mutates" = true ]; then
              docker exec app ./node_modules/.bin/tradejs runtime-config verify \
                --user "$RUNTIME_USER" \
                --deployment "$RUNTIME_DEPLOYMENT"
            fi
