name: Docker Maintenance
on:
  workflow_dispatch:
    inputs:
      prune_images:
        description: "Remove old images and expired leases while preserving rollback versions"
        required: true
        default: true
        type: boolean

      dry_run:
        description: "Show the cleanup plan without deleting Docker objects"
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  prune-images:
    if: ${{ inputs.prune_images }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Deploy
        uses: actions/checkout@v6

      - name: Copy retention-aware maintenance script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/docker-image-prune.sh,scripts/docker-image-maintenance.py"
          target: ~/

      - name: Remove old Docker images and expired leases
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAINTENANCE_DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: MAINTENANCE_DRY_RUN
          script: |
            chmod +x "$HOME/scripts/docker-image-prune.sh"
            command -v python3 >/dev/null
            if [ "$MAINTENANCE_DRY_RUN" = true ]; then
              "$HOME/scripts/docker-image-prune.sh" --dry-run
            else
              "$HOME/scripts/docker-image-prune.sh"
            fi
