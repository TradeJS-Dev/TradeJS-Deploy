name: Docker Maintenance
on:
  workflow_dispatch:
    inputs:
      prune_images:
        description: "Prune unused server images while preserving replay leases"
        required: true
        default: true
        type: boolean

jobs:
  prune-images:
    if: ${{ inputs.prune_images }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Deploy
        uses: actions/checkout@v6

      - name: Copy retention-aware maintenance script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/docker-image-prune.sh"
          target: ~/

      - name: Prune Docker images on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            chmod +x "$HOME/scripts/docker-image-prune.sh"
            "$HOME/scripts/docker-image-prune.sh"
